plugins {
    id 'com.android.application'
}

android {
    namespace 'com.burzhbeats.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.burzhbeats.app"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "0.21.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
