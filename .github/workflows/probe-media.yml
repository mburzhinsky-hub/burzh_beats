name: Probe media delivery
# Manual diagnostic: how fast does GitHub Pages serve the mixes the way a phone asks for them,
# cold (nobody asked for a while) and after a tiny "warm-up" request?
on:
  workflow_dispatch:
    inputs:
      file:
        description: "media file to test, e.g. trance/mix-02.m4a"
        default: "trance/mix-02.m4a"
      mode:
        description: "warm = tiny range request first, cold = straight to the real requests"
        default: "warm"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Range timing and CDN headers
        run: |
          U="https://mburzhinsky-hub.github.io/burzh_beats/media/${{ inputs.file }}"
          MODE="${{ inputs.mode }}"
          SIZE=$(curl -sI "$U" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')
          MID=$((SIZE/2)); Q1=$((SIZE/4)); Q3=$((SIZE*3/4))
          n=0
          probe() { # range label
            n=$((n+1))
            curl -sS -o /dev/null -D /tmp/h.txt -H "Range: bytes=$1" \
              -w "ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}" "$U" > /tmp/w.txt || echo "curl failed" > /tmp/w.txt
            H=$(grep -i -E '^(x-cache|age|x-served-by):' /tmp/h.txt | tr -d '\r' | tr '\n' ' ')
            echo "::notice title=$(printf %02d $n) $2::$(cat /tmp/w.txt) | $H"
          }
          echo "::notice title=00 start::$MODE $U size=$SIZE"
          if [ "$MODE" = "warm" ]; then
            probe "0-1" "WARM 0-1"
            sleep 4
          fi
          probe "0-1" "phone step 1: probe 0-1"
          probe "0-1048575" "phone step 2: moov 1MB"
          probe "$MID-$((MID+262143))" "phone step 3: middle 256KB"
          probe "$Q1-$((Q1+262143))" "other spot 1/4"
          probe "$Q3-$((Q3+262143))" "other spot 3/4"
          sleep 2
          probe "$MID-$((MID+262143))" "middle again"
          probe "$((SIZE-262144))-$((SIZE-1))" "tail"
