name: Import Trance media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-trance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download public Google Drive audio
        run: |
          python -m pip install --quiet gdown
          mkdir -p docs/media
          gdown "https://drive.google.com/uc?id=1wJ2tqF3hg7JlzdRJMPzWMChB6MFO6pWT" -O docs/media/trance.m4a
          test -s docs/media/trance.m4a
          ls -lh docs/media/trance.m4a
      - name: Commit media into Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/trance.m4a
          git commit -m "Add local Trance media for PWA"
          git push
