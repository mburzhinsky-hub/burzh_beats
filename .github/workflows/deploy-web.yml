name: Deploy BURZH beats web

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-web.yml'
      - 'tools/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate: a release that fails these checks is never published.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: for f in docs/app.js docs/planet.js docs/sound.js docs/sound-ui.js docs/sw.js; do node --check "$f"; done
      - name: Station list, artwork and audio files
        run: python3 tools/radio.py validate
      - name: Browser tests
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          node run.js

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # After every release: ask the live site for the audio exactly like a phone would.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live site check (Range requests, CORS, file sizes)
        run: python3 tools/live_check.py "${{ needs.deploy.outputs.page_url }}"
