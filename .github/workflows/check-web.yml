name: Check web radio

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/check-web.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/check-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/sw.js

      - name: Station list, icons and artwork
        run: python3 tools/radio.py validate
