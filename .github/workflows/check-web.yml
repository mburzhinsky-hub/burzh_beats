name: Check web radio

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/check-web.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/check-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax
        run: |
          for f in docs/app.js docs/planet.js docs/sound.js docs/sound-ui.js docs/sw.js; do node --check "$f"; done

      - name: Station list, icons and artwork
        run: python3 tools/radio.py validate
