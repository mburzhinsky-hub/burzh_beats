name: Import Trance Mix2 media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-trance-mix2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download public Google Drive Mix2
        run: |
          python -m pip install --quiet gdown
          mkdir -p docs/media
          gdown "https://drive.google.com/uc?id=1hhdiSG5G2s_VyB0JkjRBbJThe5i_SWCl" -O docs/media/trance-mix2.m4a
          test -s docs/media/trance-mix2.m4a
          ls -lh docs/media/trance-mix2.m4a
      - name: Commit Mix2 into Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/trance-mix2.m4a
          git commit -m "Add Trance Mix2 media" || exit 0
          git push
